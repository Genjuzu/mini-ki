[project]
name = "mini-ki"
version = "0.1.0"
description = "Antwortspeicher für das eigene Gerät. Kern ohne Projekt-Kopplung."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlite-vec",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
lokal = [
    "fastembed",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "modell: lokales Einbettungsmodell (fastembed); ohne Paket übersprungen",
]
