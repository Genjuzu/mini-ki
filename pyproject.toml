[project]
name = "mini-ki"
version = "0.1.0"
description = "Antwortspeicher für das eigene Gerät. Kern ohne Projekt-Kopplung."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlite-vec",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
lokal = [
    "fastembed",
]
# Systemwerkzeug ffmpeg mit libopus. Bewusst kein Python-Paket:
# ohne ffmpeg überspringt tests/test_audio_opus.py die Umwandlung.
audio = []
# PDF über pypdf (BSD-3-Clause), DOCX über python-docx (MIT).
# TXT, Markdown und EPUB bleiben in der Standardbibliothek.
# Ohne diese Pakete überspringt tests/test_text_holen.py nur die
# betroffenen Tests.
dokumente = [
    "pypdf",
    "python-docx",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "modell: lokales Einbettungsmodell (fastembed); ohne Paket übersprungen",
    "audio: optionale Abhängigkeit audio (ffmpeg mit libopus); ohne sie übersprungen",
    "dokumente: optionale Abhängigkeit dokumente (pypdf, python-docx); ohne sie übersprungen",
]
